name: Windows-exe bauen

# Baut bei jedem Push die exe. Ein GitHub-Release wird nur erstellt,
# wenn es zur Version in freisteller/version.py noch keinen gibt.
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Version lesen
        id: version
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0, '.'); from freisteller.version import APP_VERSION; print(APP_VERSION)"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $v"

      - name: KI-Modell aus dem Cache
        uses: actions/cache@v4
        with:
          path: modelle/isnet-general-use.onnx
          key: modell-isnet-general-use-60920e99

      - name: KI-Modell laden und prüfen
        run: python build/modell_laden.py

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r build/requirements-build.txt

      - name: Selbsttest (Quellcode)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python app.py --selftest

      - name: Versionsangaben erzeugen
        run: python build/make_version_info.py

      - name: exe bauen
        run: pyinstaller --noconfirm --clean build/build.spec

      - name: Selbsttest (exe)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $log = Join-Path $env:RUNNER_TEMP "selbsttest.log"
          $p = Start-Process -FilePath "dist/Bild-SVG-Converter-MK2.exe" -ArgumentList "--selftest","--selftest-log","`"$log`"" -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "Selbsttest der exe fehlgeschlagen (Exit-Code $($p.ExitCode))" }
          # Die exe darf nichts neben sich ablegen
          $neben = Get-ChildItem dist | Where-Object { $_.Name -ne "Bild-SVG-Converter-MK2.exe" }
          if ($neben) { $neben | ForEach-Object { Write-Host "Unerwartet neben der exe: $($_.Name)" }; throw "Neben der exe sind Dateien entstanden" }
          Write-Host "Neben der exe liegt nichts – ok"

      - name: Release-Dateien bereitstellen
        id: zip
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $name = "Bild-SVG-Converter-MK2-v$v-windows"
          New-Item -ItemType Directory -Force -Path paket | Out-Null
          # Nur die eine exe – keine Nebendateien
          Copy-Item dist/Bild-SVG-Converter-MK2.exe "paket/$name.exe"
          # Offline-Build-Kit zusätzlich als eigenes ZIP
          Compress-Archive -Path offline_build_kit -DestinationPath "paket/Bild-SVG-Converter-MK2-v$v-offline-build-kit.zip" -Force
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-ChildItem paket

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: paket/*
          retention-days: 30

      - name: Gibt es den Release schon?
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag existiert bereits – kein neuer Release."
            "neu=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "Neuer Release $tag wird erstellt."
            "neu=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          $global:LASTEXITCODE = 0

      - name: Release erstellen
        if: steps.release.outputs.neu == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Bild-SVG Converter MK2 v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            paket/${{ steps.zip.outputs.name }}.exe
            paket/Bild-SVG-Converter-MK2-v${{ steps.version.outputs.version }}-offline-build-kit.zip
          body: |
            Bild-SVG Converter MK2 v${{ steps.version.outputs.version }}

            - `Bild-SVG-Converter-MK2-v${{ steps.version.outputs.version }}-windows.exe`: herunterladen und starten – eine einzige Datei, keine Installation, keine Nebendateien. Das KI-Modell ist in der exe enthalten, das Programm arbeitet komplett offline. Einstellungen liegen in `%APPDATA%\Bild-SVG-Converter-MK2`.
            - `...-offline-build-kit.zip`: exe auf einem Windows-10-PC ohne Internet selbst bauen (Mac lädt die Pakete) – siehe `ANLEITUNG.md` im Kit.
